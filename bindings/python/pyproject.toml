[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coverwise"
version = "1.5.0"
description = "Pairwise and t-wise combinatorial test generation, with pytest integration"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "libraz", email = "libraz@libraz.net" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
keywords = [
    "combinatorial-testing",
    "covering-array",
    "pairwise-testing",
    "pytest",
    "t-wise",
    "test-generation",
]

[project.scripts]
coverwise = "coverwise.cli:main"

[project.optional-dependencies]
# coverwise.parametrize is the only surface that needs pytest, and it needs it
# where tests run rather than where the package is installed.
pytest = [
    "pytest>=8.0",
]
dev = [
    "build>=1.6",
    "mypy>=2.3",
    "pytest>=9.0",
    "ruff>=0.16",
    "wheel>=0.48",
]

[project.urls]
Homepage = "https://github.com/libraz/coverwise"
Documentation = "https://github.com/libraz/coverwise/tree/main/docs/en"
Repository = "https://github.com/libraz/coverwise"
Issues = "https://github.com/libraz/coverwise/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/coverwise"]
# The native CLI is a build product rather than a tracked source file, so it is
# the one payload the package sources do not already carry. The PEP 561 marker
# rides along with them, and the wheel is inspected for it by the test suite:
# without the marker in the wheel, every annotation this package ships reads as
# Any at the consumer's type checker.
artifacts = ["src/coverwise/_bin/coverwise"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "scripts/",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.rye]
dev-dependencies = [
    "build>=1.6",
    "mypy>=2.3",
    "pytest>=9.0",
    "ruff>=0.16",
    "wheel>=0.48",
]
