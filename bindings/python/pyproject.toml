[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coverwise"
version = "1.4.0"
description = "Native command-line interface for combinatorial test coverage"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "libraz", email = "libraz@libraz.net" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
keywords = [
    "combinatorial-testing",
    "covering-array",
    "pairwise-testing",
    "t-wise",
    "test-generation",
]

[project.scripts]
coverwise = "coverwise.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "ruff>=0.8",
    "wheel>=0.45",
]

[project.urls]
Homepage = "https://github.com/libraz/coverwise"
Documentation = "https://github.com/libraz/coverwise/tree/main/docs/en"
Repository = "https://github.com/libraz/coverwise"
Issues = "https://github.com/libraz/coverwise/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/coverwise"]
artifacts = ["src/coverwise/_bin/coverwise"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "scripts/",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.rye]
dev-dependencies = [
    "build>=1.2",
    "pytest>=8.0",
    "ruff>=0.8",
    "wheel>=0.45",
]
