  <rect class="chip" x="401" y="226" width="46" height="26" rx="4"/>
  <text class="mono" x="424" y="243" text-anchor="middle">0 1</text>
  <rect class="chip" x="452" y="226" width="46" height="26" rx="4"/>
  <text class="mono" x="475" y="243" text-anchor="middle">1 0</text>
  <rect class="chip" x="503" y="226" width="46" height="26" rx="4"/>
  <text class="mono" x="526" y="243" text-anchor="middle">1 1</text>
