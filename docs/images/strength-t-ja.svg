  <rect class="chip" x="784" y="140" width="46" height="26" rx="4"/>
  <text class="mono" x="807" y="157" text-anchor="middle">0 1 1</text>
  <rect class="chip" x="631" y="171" width="46" height="26" rx="4"/>
