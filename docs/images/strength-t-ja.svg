  <rect class="chip" x="171" y="226" width="46" height="26" rx="4"/>
  <text class="mono" x="194" y="243" text-anchor="middle">1</text>
  <text class="n2" x="168" y="274" text-anchor="middle">6<tspan class="h" dx="6">カバレッジ単位</tspan></text>
  <text class="s" x="168" y="292" text-anchor="middle">3 個 × 2 通り = 6</text>
  <path class="rule" d="M54,306 H283"/>
  <text class="lbl" x="54" y="324">スイート</text>
  <text class="lbl" x="120" y="340" text-anchor="middle">A</text>
