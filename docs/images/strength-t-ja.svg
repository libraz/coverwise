  <text class="s" x="449" y="292" text-anchor="middle">3 組 × 4 通り = 12</text>
  <path class="rule" d="M335,306 H564"/>
  <text class="lbl" x="335" y="324">スイート</text>
  <text class="lbl" x="401" y="340" text-anchor="middle">A</text>
