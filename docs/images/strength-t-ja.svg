  <path class="seam" d="M40,584 H860"/>
  <text class="s" x="450" y="604" text-anchor="middle">どのパネルでも、テストケースは 3 つのパラメータすべてに値を割り当てます。行は増えますが、幅は広がりません。</text>
  <text class="s" x="450" y="622" text-anchor="middle">t はカバレッジ単位の大きさであって、テストケースの大きさではありません。</text>
</svg>
