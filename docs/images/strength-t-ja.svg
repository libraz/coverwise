  <rect class="chip" x="682" y="140" width="46" height="26" rx="4"/>
  <text class="mono" x="705" y="157" text-anchor="middle">0 0 1</text>
  <rect class="chip" x="733" y="140" width="46" height="26" rx="4"/>
