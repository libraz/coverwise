<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-labelledby="cw-strength-t cw-strength-d">
  <title id="cw-strength-t">強度 t が変えるもの、変えないもの</title>
  <desc id="cw-strength-d">2 値のパラメータ A・B・C からなる同じモデルを、3 つのパネルで比べています。強度 1 ではカバレッジ単位が名指すパラメータは 1 つで 6 単位、強度 2 では 2 つで 12 単位、強度 3 では 3 つすべてで 8 単位になります。各パネルの下は、その強度でエンジンが生成したスイートで、それぞれ 2 件・5 件・8 件です。どのパネルでもテストケースは 3 セル分の幅です。テストケースは必ずすべてのパラメータに値を割り当てるからです。</desc>

  <style>
    .bg   { fill:#f6f7f9 }
    .grp  { fill:#eceef2 }
    .chip { fill:#ffffff; stroke:#d5d9e0 }
    .op   { fill:#ffffff; stroke:#2b6cb0 }
    .rule { fill:none; stroke:#c3c8d0; stroke-width:1 }
    .seam { fill:none; stroke:#c3c8d0; stroke-dasharray:6 5 }
    .ln   { fill:none; stroke:#2b6cb0; stroke-width:1.4 }
    .ah   { fill:#2b6cb0 }
    text  { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h    { font-size:12.5px }
    .lbl  { font-size:11px; fill:#6e7781; letter-spacing:.06em }
    .s    { font-size:10.5px; fill:#6e7781 }
    .n    { font-size:24px; fill:#1f2328 }
    .n2   { font-size:24px; fill:#2a7f6f }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#2b6cb0 }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d} .op{fill:#161b22;stroke:#7fb3d5}
      .rule{stroke:#484f58} .seam{stroke:#484f58}
      .ln{stroke:#7fb3d5} .ah{fill:#7fb3d5}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e}
      .n{fill:#e6edf3} .n2{fill:#6fc2ae} .mono{fill:#7fb3d5}
    }
  </style>
  <rect class="bg" x="0" y="0" width="900" height="640" rx="12"/>

  <!-- t = 1 -->
  <text class="mono" x="168" y="46" text-anchor="middle" font-size="15">t = 1</text>
  <text class="s" x="168" y="64" text-anchor="middle">単位は 1 パラメータ</text>
  <rect class="grp" x="110" y="76" width="117" height="58" rx="7"/>
  <text class="mono" x="120" y="92" font-size="10.5">A</text>
  <rect class="chip" x="120" y="98" width="46" height="26" rx="4"/>
  <text class="mono" x="143" y="115" text-anchor="middle">0</text>
  <rect class="chip" x="171" y="98" width="46" height="26" rx="4"/>
  <text class="mono" x="194" y="115" text-anchor="middle">1</text>
  <rect class="grp" x="110" y="140" width="117" height="58" rx="7"/>
  <text class="mono" x="120" y="156" font-size="10.5">B</text>
  <rect class="chip" x="120" y="162" width="46" height="26" rx="4"/>
  <text class="mono" x="143" y="179" text-anchor="middle">0</text>
  <rect class="chip" x="171" y="162" width="46" height="26" rx="4"/>
  <text class="mono" x="194" y="179" text-anchor="middle">1</text>
  <rect class="grp" x="110" y="204" width="117" height="58" rx="7"/>
  <text class="mono" x="120" y="220" font-size="10.5">C</text>
