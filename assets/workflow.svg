<svg viewBox="0 0 760 250" width="760" height="250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="coverwise workflow: no tests to generate to existing tests; existing tests to analyze to a 100 percent decision; no loops through extend back to existing tests, yes ends at done">
  <style>
    .box  { fill: #ffffff; stroke: #cbd5e1; }
    .diam { fill: #eff6ff; stroke: #93c5fd; }
    .txt  { fill: #1f2937; font-weight: 600; }
    .op   { fill: #2563eb; font-weight: 600; }
    .edge { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .lbl  { fill: #64748b; font-weight: 500; }
    #head { fill: #94a3b8; }
    @media (prefers-color-scheme: dark) {
      .box  { fill: #0d1117; stroke: #30363d; }
      .diam { fill: #10233b; stroke: #1f6feb; }
      .txt  { fill: #e6edf3; }
      .op   { fill: #58a6ff; }
      .edge { stroke: #6e7681; }
      .lbl  { fill: #8b949e; }
      #head { fill: #6e7681; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path id="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- Edges (drawn first, under the nodes) -->
  <!-- No tests -> generate -->
  <path class="edge" marker-end="url(#arrow)" d="M144,50 H206"/>
  <!-- generate -> Existing tests (down, left, into top) -->
  <path class="edge" marker-end="url(#arrow)" d="M270,72 V96 H94 V114"/>
  <!-- Existing tests -> analyze -->
  <path class="edge" marker-end="url(#arrow)" d="M164,140 H220"/>
  <!-- analyze -> 100%? -->
  <path class="edge" marker-end="url(#arrow)" d="M334,140 H388"/>
  <!-- 100%? -> Done (Yes) -->
  <path class="edge" marker-end="url(#arrow)" d="M496,140 H572"/>
  <!-- 100%? -> extend (No) -->
  <path class="edge" marker-end="url(#arrow)" d="M444,174 V227 H340"/>
  <!-- extend -> Existing tests (loop back into bottom) -->
  <path class="edge" marker-end="url(#arrow)" d="M224,227 H94 V166"/>

  <!-- Edge labels -->
  <text class="lbl" x="534" y="130" font-size="12">Yes</text>
  <text class="lbl" x="452" y="200" font-size="12">No</text>

  <!-- Nodes -->
  <rect class="box" x="24"  y="28"  width="120" height="44" rx="8"/>
  <text class="txt" x="84"  y="55"  font-size="15" text-anchor="middle">No tests</text>

  <rect class="box" x="210" y="28"  width="120" height="44" rx="8"/>
  <text class="op"  x="270" y="55"  font-size="15" text-anchor="middle">generate</text>

  <rect class="box" x="24"  y="118" width="140" height="44" rx="8"/>
  <text class="txt" x="94"  y="145" font-size="15" text-anchor="middle">Existing tests</text>

  <rect class="box" x="220" y="118" width="114" height="44" rx="8"/>
  <text class="op"  x="277" y="145" font-size="15" text-anchor="middle">analyze</text>

  <polygon class="diam" points="444,106 496,140 444,174 392,140"/>
  <text class="txt" x="444" y="145" font-size="14" text-anchor="middle">100%?</text>

  <rect class="box" x="574" y="118" width="112" height="44" rx="8"/>
  <text class="txt" x="630" y="145" font-size="15" text-anchor="middle">Done</text>

  <rect class="box" x="224" y="206" width="116" height="42" rx="8"/>
  <text class="op"  x="282" y="232" font-size="15" text-anchor="middle">extend</text>
</svg>
