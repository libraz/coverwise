name: Publish and Create Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Verify tag and manifest versions
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          python_version="$(python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path("bindings/python/pyproject.toml").read_text()
          match = re.search(r'^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"$', text, re.MULTILINE)
          if match is None:
              raise SystemExit("No Python package version found")
          print(match.group(1))
          PY
          )"
          python3 bindings/python/scripts/check_version.py
          cmake -S . -B build-version-check -DBUILD_TESTING=OFF -DBUILD_CLI=OFF
          cmake_version="$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build-version-check/CMakeCache.txt)"
          if [[ "$GITHUB_REF_NAME" != "v$package_version" || "$tag_version" != "$cmake_version" || "$tag_version" != "$python_version" ]]; then
            echo "Version mismatch: tag=$GITHUB_REF_NAME npm=$package_version cmake=$cmake_version pypi=$python_version" >&2
            exit 1
          fi

  publish-npm:
    needs: verify-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mymindstorm/setup-emsdk@v16
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@11
      - run: corepack enable
      - run: corepack prepare yarn@4.18.0 --activate
      - uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Build and test C++
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - name: Build and verify native Linux distribution
        shell: bash
        run: |
          set -euo pipefail
          archive="coverwise-${GITHUB_REF_NAME}-linux-x64"
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build-release --parallel
          cmake --install build-release --prefix "$RUNNER_TEMP/$archive"
          "$RUNNER_TEMP/$archive/bin/coverwise" --help
          tar -C "$RUNNER_TEMP" -czf "$GITHUB_WORKSPACE/$archive.tar.gz" "$archive"
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn lint
      - run: yarn test
      - name: Verify packed public exports
        shell: bash
        run: |
          set -euo pipefail
          package_file="$(npm pack --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s)[0].filename))")"
          consumer="$(mktemp -d)"
          cd "$consumer"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$package_file" >/dev/null
          node --input-type=module <<'NODE'
          await import('@libraz/coverwise');
          await import('@libraz/coverwise/pure');
          await import('@libraz/coverwise/constraint');
          const packageJson = await import('@libraz/coverwise/package.json', { with: { type: 'json' } });
          if (!packageJson.default.version || !import.meta.resolve('@libraz/coverwise/wasm').endsWith('.wasm')) {
            throw new Error('Packed public export smoke test failed');
          }
          NODE
      - name: Publish to npm
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if npm view "@libraz/coverwise@$version" version >/dev/null 2>&1; then
            echo "@libraz/coverwise@$version already exists; skipping"
          else
            npm publish --access public --provenance
          fi
      - name: Verify published package
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          for attempt in 1 2 3 4 5; do
            published="$(npm view "@libraz/coverwise@$version" version 2>/dev/null || true)"
            [[ "$published" == "$version" ]] && exit 0
            sleep 5
          done
          echo "Published package @libraz/coverwise@$version was not visible in the registry" >&2
          exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: native-linux-x64
          path: coverwise-${{ github.ref_name }}-linux-x64.tar.gz
          # Artifacts outlive a single attempt, so re-running the whole workflow
          # after a publish failure would otherwise collide with itself.
          overwrite: true

  python-linux-wheel:
    needs: verify-release
    runs-on: ${{ matrix.runner }}
    container: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Build and repair manylinux wheel
        shell: bash
        run: |
          set -euo pipefail
          dnf install -y cmake
          python_bin=/opt/python/cp312-cp312/bin/python
          "$python_bin" -m pip install --upgrade build wheel auditwheel pytest
          PYTHON="$python_bin" COVERWISE_WHEEL_PLATFORM_TAG=manylinux_2_28_${{ matrix.arch }} \
            bindings/python/scripts/build_wheel.sh
          "$python_bin" -m auditwheel repair bindings/python/dist/*.whl \
            --plat manylinux_2_28_${{ matrix.arch }} --wheel-dir bindings/python/wheelhouse
      - name: Test installed wheel
        shell: bash
        run: |
          set -euo pipefail
          python_bin=/opt/python/cp312-cp312/bin/python
          "$python_bin" -m venv /tmp/coverwise-wheel-test
          /tmp/coverwise-wheel-test/bin/python -m pip install bindings/python/wheelhouse/*.whl pytest
          /tmp/coverwise-wheel-test/bin/python -m pytest bindings/python/tests -v
      - uses: actions/upload-artifact@v7
        with:
          name: python-wheel-manylinux-${{ matrix.arch }}
          path: bindings/python/wheelhouse/*.whl
          overwrite: true

  python-macos-wheel:
    needs: verify-release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Build macOS wheel
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade build wheel pytest
          bindings/python/scripts/build_wheel.sh
      - name: Test installed wheel
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/coverwise-wheel-test
          /tmp/coverwise-wheel-test/bin/python -m pip install bindings/python/dist/*.whl pytest
          /tmp/coverwise-wheel-test/bin/python -m pytest bindings/python/tests -v
      - uses: actions/upload-artifact@v7
        with:
          name: python-wheel-macos-arm64
          path: bindings/python/dist/*.whl
          overwrite: true

  publish-pypi:
    needs: [publish-npm, python-linux-wheel, python-macos-wheel]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/coverwise
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: python-wheel-*
          path: dist/
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  create-github-release:
    needs: [publish-npm, publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: native-linux-x64
          path: dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/coverwise-${{ github.ref_name }}-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
