name: Publish and Create Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag, package, and CMake versions
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          cmake -S . -B build-version-check -DBUILD_TESTING=OFF -DBUILD_CLI=OFF
          cmake_version="$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build-version-check/CMakeCache.txt)"
          if [[ "$GITHUB_REF_NAME" != "v$package_version" || "$tag_version" != "$cmake_version" ]]; then
            echo "Version mismatch: tag=$GITHUB_REF_NAME package=$package_version cmake=$cmake_version" >&2
            exit 1
          fi

      - uses: mymindstorm/setup-emsdk@v16

      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.1'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@latest
      - run: corepack enable
      - run: corepack prepare yarn@4.12.0 --activate

      - uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Build and test C++
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Build and verify native Linux distribution
        shell: bash
        run: |
          set -euo pipefail
          archive="coverwise-${GITHUB_REF_NAME}-linux-x64"
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build-release --parallel
          cmake --install build-release --prefix "$RUNNER_TEMP/$archive"
          "$RUNNER_TEMP/$archive/bin/coverwise" --help
          tar -C "$RUNNER_TEMP" -czf "$GITHUB_WORKSPACE/$archive.tar.gz" "$archive"

      - run: yarn install --immutable
      - run: yarn build
      - run: yarn lint
      - run: yarn test
      - name: Verify packed public exports
        shell: bash
        run: |
          set -euo pipefail
          package_file="$(npm pack --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s)[0].filename))")"
          consumer="$(mktemp -d)"
          cd "$consumer"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$package_file" >/dev/null
          node --input-type=module <<'NODE'
          await import('@libraz/coverwise');
          await import('@libraz/coverwise/pure');
          await import('@libraz/coverwise/constraint');
          const packageJson = await import('@libraz/coverwise/package.json', { with: { type: 'json' } });
          if (!packageJson.default.version || !import.meta.resolve('@libraz/coverwise/wasm').endsWith('.wasm')) {
            throw new Error('Packed public export smoke test failed');
          }
          NODE

      - run: npm publish --access public --provenance

      - name: Verify published package
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          for attempt in 1 2 3 4 5; do
            published="$(npm view "@libraz/coverwise@$version" version 2>/dev/null || true)"
            [[ "$published" == "$version" ]] && exit 0
            sleep 5
          done
          echo "Published package @libraz/coverwise@$version was not visible in the registry" >&2
          exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: coverwise-${{ github.ref_name }}-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
