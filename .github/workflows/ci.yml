name: CI

on:
  push:
    # develop is where work lands; main only receives release promotions, so
    # gating on main alone would first exercise a change at release time.
    branches: [main, develop]
    tags-ignore: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn format:check
      - name: Enforce independent validator dependency boundary
        run: |
          if git grep -n "core/" -- src/validator src/ts/validator; then
            echo "Validators must not depend on generator/core internals" >&2
            exit 1
          fi

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: mymindstorm/setup-emsdk@v16

      - name: Cache CMake dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: ${{ runner.os }}-cmake-deps-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cmake-deps-

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential lcov ccache

      - name: Setup ccache
        run: |
          ccache --set-config=max_size=500M
          ccache --zero-stats

      - name: Configure CMake with coverage
        env:
          CC: ccache gcc
          CXX: ccache g++
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DENABLE_COVERAGE=ON

      - name: Build C++
        run: cmake --build build --parallel

      - name: Show ccache statistics
        run: ccache --show-stats

      - name: Run C++ tests
        run: ctest --test-dir build --output-on-failure --parallel

      - name: Generate coverage report
        run: |
          mkdir -p build/coverage
          lcov --directory build --capture --output-file build/coverage/coverage.info --ignore-errors source,gcov,mismatch
          lcov --extract build/coverage/coverage.info "${PWD}/src/*" --output-file build/coverage/coverage_filtered.info --ignore-errors unused

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/coverage/coverage_filtered.info
          flags: unittests
          name: codecov-coverwise
          fail_ci_if_error: false

      - run: yarn install --immutable
      - run: yarn build
      - run: yarn test:coverage

      - name: Upload JavaScript coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: javascript
          name: codecov-coverwise-js
          fail_ci_if_error: false

  python-binding:
    # The release pipeline is the only other place these wheels are built, and a
    # failure there lands after npm has already published.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install build dependencies
        run: python3 -m pip install --upgrade build wheel pytest ruff twine

      - name: Check release version consistency
        run: python3 bindings/python/scripts/check_version.py

      - name: Lint
        run: |
          ruff format --check bindings/python/src bindings/python/tests
          ruff check bindings/python/src bindings/python/tests

      - name: Build wheel
        run: bindings/python/scripts/build_wheel.sh

      - name: Validate wheel metadata
        run: python3 -m twine check bindings/python/dist/*.whl

      - name: Test installed wheel
        run: |
          python3 -m venv /tmp/coverwise-wheel-test
          /tmp/coverwise-wheel-test/bin/python -m pip install bindings/python/dist/*.whl pytest
          /tmp/coverwise-wheel-test/bin/python -m pytest bindings/python/tests -v

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Configure ASan and UBSan
        run: |
          cmake -B build-sanitize \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DENABLE_SANITIZERS=ON

      - name: Build sanitizer targets
        run: cmake --build build-sanitize --parallel

      - name: Run sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitize --output-on-failure --parallel
